<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>about:blank</title>
</head>
<body>
  <script>
    async function loadAndRun() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/Nethywy-ui/jsdelivrs@main/cleaglercraft262.html.pa"
        ,"https://cdn.jsdelivr.net/gh/Nethywy-ui/jsdelivrs@main/cleaglercraft262.html.pb"
        ,"https://cdn.jsdelivr.net/gh/Nethywy-ui/jsdelivrs@main/cleaglercraft262.html.pc"
        ,"https://cdn.jsdelivr.net/gh/Nethywy-ui/jsdelivrs@main/cleaglercraft262.html.pd"
      ];
      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);
        fullHtml += await res.text();
      }

      document.open();
      document.write(fullHtml);
      document.close();
    }

    loadAndRun();
  </script>
</body>
</html>
