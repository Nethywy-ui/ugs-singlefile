/* Cross-origin Worker shim: fetch remote worker script and re-create as blob */
(function(){
  var OrigWorker = window.Worker;
  function ShimWorker(url, opts){
    try {
      if (typeof url === "string" && /^https?:/i.test(url)) {
        var a = document.createElement("a"); a.href = url;
        if (a.origin !== location.origin) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, false);
          xhr.send();
          if (xhr.status >= 200 && xhr.status < 300) {
            var blob = new Blob([xhr.responseText], { type: "text/javascript" });
            return new OrigWorker(URL.createObjectURL(blob), opts);
          }
        }
      }
    } catch (e) { /* fall through to original */ }
    return new OrigWorker(url, opts);
  }
  ShimWorker.prototype = OrigWorker.prototype;
  window.Worker = ShimWorker;
})();
</script>
