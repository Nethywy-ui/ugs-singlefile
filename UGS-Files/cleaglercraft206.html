    document.addEventListener("DOMContentLoaded", () => {
    async function loadAndRun() {
      const urls = [

      "https://cdn.jsdelivr.net/gh/Nethywy-ui/jsdelivrs@2bdc3d4/cleaglercraft206pb.html",
      "https://cdn.jsdelivr.net/gh/Nethywy-ui/jsdelivrs@2bdc3d4/cleaglercraft206pc.html",
      ];
      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);

      document.open();
      document.write(fullHtml);
      document.close();
    }

    loadAndRun();
    })
